[project]
name = "gitforce"
version = "0.1.0"
description = "Gitforce — Autonomous, Human-Governed Software Engineering Agent"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Gitforce" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "langchain>=0.3",
    "langgraph>=1.2",
    "langchain-core>=0.3",
    "langgraph-checkpoint-postgres>=3.1",
    "langgraph-checkpoint-sqlite>=3.1",
    "psycopg-pool>=3.2",
    "openai>=1.40",
    "anthropic>=0.34",
    "mcp>=1.2",
    "python-multipart>=0.0.9",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gitforce"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4"]
ignore = ["B008", "S104"]

[tool.ruff.lint.per-file-ignores]
"gitforce/tests/**/*.py" = ["S101", "S105", "S106", "S108", "S603", "S607", "E501"]
"alembic/*.py" = ["I001"]
"alembic/versions/*.py" = ["UP007", "UP035", "I001", "S603", "E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["gitforce/tests"]