services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gitforce
      POSTGRES_PASSWORD: gitforce
      POSTGRES_DB: gitforce
    ports:
      - "5432:5432"
    volumes:
      - gitforce_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitforce -d gitforce"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gitforce_pgdata: